name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,anthropic,openai,mcp,embedding]"
          pip install ruff pytest-cov

      - name: Ruff lint
        run: ruff check --select E9,F63,F7,F82 caveman tests

      - name: Type check
        run: python scripts/ci_mypy_gate.py

      - name: Run tests with coverage gate
        run: python scripts/ci_coverage_gate.py

      - name: Verify CLI entry point
        run: |
          caveman version
          caveman --help
          python -m caveman version

  install-smoke:
    name: Install smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install smoke benchmark (<3min)
        run: python scripts/install_smoke.py --source . --max-seconds 180 --output install-smoke-${{ matrix.os }}.json

      - name: Upload install smoke report
        uses: actions/upload-artifact@v4
        with:
          name: install-smoke-${{ matrix.os }}
          path: install-smoke-${{ matrix.os }}.json

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate API reference and verify committed output
        run: |
          python scripts/generate_api_reference.py
          git diff --exit-code docs/API_REFERENCE.md
